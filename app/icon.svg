      <stop offset="100%" stop-color="#1A1F30" />
    </linearGradient>

    <linearGradient id="spHexBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FF9500" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.4" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 84" fill="none">
  <defs>
    <linearGradient id="logoHexBg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#1A1F30" />
    </linearGradient>

    <linearGradient id="logoHexBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FF9500" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="logoRibbonGrad" x1="20" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3700" />
      <stop offset="30%" stop-color="#FF6B00" />
      <stop offset="70%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <linearGradient id="logoPLoopGrad" x1="50" y1="20" x2="80" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA800" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3B00" />
    </linearGradient>

    <radialGradient id="logoNexusGlow" cx="50" cy="50" r="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#FF9500" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0" />
    </radialGradient>

    <filter id="logoNeonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Emblem Group (scaled & positioned at x=4, y=4, size 76x76) -->
  <g transform="translate(4, 4) scale(0.76)">
    <path
      d="M 50 6 L 86 26.8 A 5 5 0 0 1 88.5 31.1 L 88.5 68.9 A 5 5 0 0 1 86 73.2 L 50 94 A 5 5 0 0 1 47.5 94 L 14 73.2 A 5 5 0 0 1 11.5 68.9 L 11.5 31.1 A 5 5 0 0 1 14 26.8 Z"
      fill="url(#logoHexBg)"
      stroke="url(#logoHexBorder)"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <circle cx="50" cy="50" r="32" fill="url(#logoNexusGlow)" />

    <g filter="url(#logoNeonBloom)" opacity="0.95">
      <path
        d="M 45 25 L 30 25 A 6 6 0 0 0 24 31 L 24 37 A 6 6 0 0 0 30 43 L 44 47 A 6 6 0 0 1 50 53 L 50 59 A 6 6 0 0 1 44 65 L 28 65"
        stroke="url(#logoRibbonGrad)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M 52 25 L 70 25 A 9 9 0 0 1 79 34 L 79 36 A 9 9 0 0 1 70 45 L 52 45 M 52 25 L 52 75"
        stroke="url(#logoPLoopGrad)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <path
      d="M 45 25 L 30 25 A 6 6 0 0 0 24 31 L 24 37 A 6 6 0 0 0 30 43 L 44 47 A 6 6 0 0 1 50 53 L 50 59 A 6 6 0 0 1 44 65 L 28 65"
      stroke="#FFF"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.75"
    />
    <path
      d="M 52 25 L 70 25 A 9 9 0 0 1 79 34 L 79 36 A 9 9 0 0 1 70 45 L 52 45 M 52 25 L 52 75"
      stroke="#FFF"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.75"
    />

    <circle cx="45" cy="25" r="3.2" fill="#FDE047" />
    <circle cx="79" cy="35" r="3.2" fill="#FDE047" />
    <polygon points="52,41 57,46 52,51 47,46" fill="#FFFFFF" stroke="#FF5500" stroke-width="1.8" />
    <circle cx="28" cy="65" r="3.2" fill="#FF6B00" />
    <circle cx="52" cy="75" r="3.2" fill="#FFA800" />
  </g>

  <!-- Typography Brand Identity -->
  <text x="92" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="900" fill="#18181B" letter-spacing="2">
    SAMRIDH
  </text>
  <circle cx="212" cy="36" r="4.5" fill="#FF5500" />
  <text x="92" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#71717A" letter-spacing="1.5">
    AI/ML × BUSINESS SYSTEMS
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 88" fill="none">
  <defs>
    <linearGradient id="logoBullBg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="50%" stop-color="#0F131F" />
      <stop offset="100%" stop-color="#181D2C" />
    </linearGradient>

    <linearGradient id="logoBullHorns" x1="10" y1="10" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="40%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#FF3300" />
    </linearGradient>

    <linearGradient id="logoBullFaceLight" x1="30" y1="25" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="50%" stop-color="#FF6200" />
      <stop offset="100%" stop-color="#DD2C00" />
    </linearGradient>

    <linearGradient id="logoBullFaceDark" x1="20" y1="40" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C43800" />
      <stop offset="100%" stop-color="#701200" />
    </linearGradient>

    <linearGradient id="logoBullBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8800" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0.8" />
    </linearGradient>

    <style>
      @keyframes hornPulse {
        0%, 100% { filter: drop-shadow(0 0 3px #FF7700); }
        50% { filter: drop-shadow(0 0 10px #FFD000); }
      }
      .logo-horns { animation: hornPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Left Bull Emblem Group (scaled at x=4, y=4, size 80x80) -->
  <g transform="translate(4, 4) scale(0.8)">
    <rect
      x="4"
      y="4"
      width="92"
      height="92"
      rx="24"
      fill="url(#logoBullBg)"
      stroke="url(#logoBullBorder)"
      stroke-width="2.6"
    />

    <path d="M 12 70 L 32 64 L 52 56 L 70 42 L 88 28" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2 3" />
    <circle cx="88" cy="28" r="2.2" fill="#10B981" opacity="0.8" />

    <!-- Horns -->
    <g class="logo-horns">
      <path d="M 36 42 C 28 32 20 22 14 13 C 13 10 16 9 18 9 C 24 13 32 22 40 36 Z" fill="url(#logoBullHorns)" />
      <path d="M 64 42 C 72 32 80 22 86 13 C 87 10 84 9 82 9 C 76 13 68 22 60 36 Z" fill="url(#logoBullHorns)" />
      <circle cx="15.5" cy="11" r="2.2" fill="#FFF" />
      <circle cx="84.5" cy="11" r="2.2" fill="#FFF" />
    </g>

    <!-- Ears -->
    <path d="M 32 38 L 18 40 L 26 47 L 34 44 Z" fill="url(#logoBullFaceDark)" />
    <path d="M 68 38 L 82 40 L 74 47 L 66 44 Z" fill="url(#logoBullFaceDark)" />

    <!-- Face Facets -->
    <polygon points="50,25 60,34 58,44 50,48 42,44 40,34" fill="url(#logoBullFaceLight)" stroke="#FFB700" stroke-width="0.8" />
    <polygon points="42,44 34,46 30,58 38,68 44,68 43,54" fill="url(#logoBullFaceDark)" stroke="#FF5500" stroke-width="0.6" />
    <polygon points="58,44 66,46 70,58 62,68 56,68 57,54" fill="url(#logoBullFaceDark)" stroke="#FF5500" stroke-width="0.6" />

    <!-- Muzzle & Bridge -->
    <polygon points="50,48 57,54 56,68 50,72 44,68 43,54" fill="url(#logoBullFaceLight)" stroke="#FF9500" stroke-width="0.8" />
    <polygon points="38,68 44,78 50,81 56,78 62,68 50,72" fill="url(#logoBullFaceDark)" stroke="#FF7700" stroke-width="0.8" />

    <!-- Nostrils -->
    <ellipse cx="46.5" cy="75" rx="1.8" ry="1.2" fill="#07090F" />
    <ellipse cx="53.5" cy="75" rx="1.8" ry="1.2" fill="#07090F" />

    <!-- Eyes -->
    <polygon points="37,46 45,50 43,52 36,48" fill="#10B981" />
    <polygon points="63,46 55,50 57,52 64,48" fill="#10B981" />

    <!-- Candlestick -->
    <line x1="50" y1="16" x2="50" y2="24" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" />
    <rect x="48.2" y="24" width="3.6" height="8" rx="0.8" fill="#10B981" stroke="#6EE7B7" stroke-width="0.6" />
    <line x1="50" y1="32" x2="50" y2="38" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Typography Brand Identity -->
  <text x="96" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="900" fill="#18181B" letter-spacing="2">
    SAMRIDH
  </text>
  <circle cx="216" cy="36" r="4.5" fill="#FF5500" />
  <text x="96" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="800" fill="#059669" letter-spacing="1.5">
    BULLISH AI × HIGH-GROWTH SYSTEMS
  </text>
</svg>
